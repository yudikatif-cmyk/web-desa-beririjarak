<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Interaktif - Pesona Beririjarak</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; overflow: hidden; margin: 0; padding: 0; }
    </style>
</head>
<body class="bg-gray-900 text-gray-800">

    <!-- CONTAINER UTAMA FULL SCREEN -->
    <main class="relative w-screen h-screen overflow-hidden">
        
        <!-- PETA LAYAR PENUH -->
        <div id="map" class="w-full h-full z-0"></div>

        <!-- FLOATING SEARCH BAR & TOMBOL KEMBALI (Kiri Atas) -->
        <div class="absolute top-5 left-14 sm:left-16 z-[500] flex items-center gap-2.5 w-[calc(100%-4.5rem)] max-w-md">
            
            <!-- Tombol Kembali ke Beranda -->
            <a href="index.html" title="Kembali ke Beranda" class="h-12 w-12 shrink-0 bg-white/95 hover:bg-[#047857] text-gray-700 hover:text-white backdrop-blur-md rounded-2xl shadow-xl border border-white/60 flex items-center justify-center transition-all duration-300">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>

            <!-- Kotak Pencarian Melayang -->
            <div class="relative flex-grow">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Cari destinasi, masjid, UMKM..." 
                    class="w-full h-12 pl-11 pr-4 rounded-2xl border border-white/60 bg-white/95 backdrop-blur-md focus:outline-none focus:ring-2 focus:ring-[#047857] text-sm text-gray-800 shadow-xl transition" 
                    autocomplete="off"
                >
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-[#047857]"></i>
                
                <!-- Dropdown Hasil Pencarian -->
                <ul id="searchResults" class="hidden absolute left-0 right-0 mt-2 bg-white/95 backdrop-blur-md border border-gray-100 rounded-2xl shadow-2xl max-h-60 overflow-y-auto z-50 divide-y divide-gray-100"></ul>
            </div>

        </div>

        <!-- BADGE LIVE MAP MENGAMBANG (Kanan Atas) -->
        <div class="hidden sm:flex absolute top-5 right-5 z-[400] bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-full shadow-xl border border-white/60 text-xs font-bold text-[#047857] items-center gap-2">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#047857]"></span>
            </span>
            Satelit Live Map
        </div>

    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/app.js"></script>
</body>
</html>
